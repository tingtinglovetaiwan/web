<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俊凱的打手槍訓練網站 - 音效強化版</title>
    <style>
        /* (這裡保留之前的 CSS 樣式，為了節省篇幅省略，請延用上一版本的 Style) */
        :root { --val-red: #ff4655; --val-dark: #0f1923; --val-white: #ece8e1; --val-cyan: #00feca; --val-gold: #ffb800; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--val-dark); color: var(--val-white); font-family: 'Segoe UI', sans-serif; overflow: hidden; user-select: none; }
        #game-stage { position: relative; width: 100vw; height: 100vh; display: none; cursor: crosshair; background: #0f1923; }
        #ui-layer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 40px; z-index: 100; background: rgba(15, 25, 35, 0.85); padding: 10px 30px; border: 1px solid var(--val-red); }
        .stat-box { text-align: center; }
        .stat-label { font-size: 12px; color: var(--val-red); }
        .stat-value { font-size: 24px; font-weight: bold; }
        #target { position: absolute; border-radius: 50%; background-size: cover; border: 2px solid var(--val-cyan); box-shadow: 0 0 20px rgba(0, 254, 202, 0.5); cursor: crosshair; transition: transform 0.1s, opacity 0.1s; }
        #target.hit { opacity: 0; transform: scale(0); }
        .hit-text { position: absolute; color: var(--val-gold); font-weight: 900; font-size: 26px; text-shadow: 0 0 10px rgba(255, 184, 0, 0.8); pointer-events: none; animation: hitTextPopup 1s forwards; }
        @keyframes hitTextPopup { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(-50%, -150%) scale(1); opacity: 0; } }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 25, 35, 0.98); padding: 40px; border-left: 8px solid var(--val-red); width: 400px; text-align: center; }
        .settings { text-align: left; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .start-trigger { background: var(--val-red); color: white; border: none; padding: 15px; width: 100%; font-size: 18px; cursor: pointer; margin-top: 20px; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%); }
    </style>
</head>
<body>

    <div id="game-stage">
        <div id="ui-layer">
            <div class="stat-box"><div class="stat-label">倒數</div><div id="timer" class="stat-value">60</div></div>
            <div class="stat-box"><div class="stat-label">分數</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">命中率</div><div id="accuracy" class="stat-value">100%</div></div>
        </div>
        <div id="target"></div>
        <div id="text-effect-container"></div>
    </div>

    <div id="menu">
        <h1>俊凱練槍大師</h1>
        <div class="settings">
            <input type="file" id="image-input" accept="image/*">
            <label>音量控制:</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
        </div>
        <button class="start-trigger" id="start-btn" disabled>上傳照片開始</button>
    </div>

    <script>
        // --- 🔊 音效設定區 ---
        // 這裡預設使用簡單的合成音效，你也可以換成自己的檔案路徑，例如 'hit.mp3'
        const hitSound = new Audio('https://actions.google.com/sounds/v1/foley/button_click.ogg');
        const missSound = new Audio('https://actions.google.com/sounds/v1/foley/glass_break.ogg');
        const winSound = new Audio('https://actions.google.com/sounds/v1/foley/tada.ogg');

        const HIT_QUOTES = ["阿公67!!", "林德懷沒老二!!", "林德懷是紅髮艾德!!"];
        const menu = document.getElementById('menu'), gameStage = document.getElementById('game-stage'), target = document.getElementById('target');
        const startBtn = document.getElementById('start-btn'), imgInput = document.getElementById('image-input'), volSlider = document.getElementById('volume-slider');
        
        let score = 0, timeLeft = 60, hits = 0, clicks = 0, gameActive = false, userImageUrl = null;

        // 圖片上傳
        imgInput.onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => { userImageUrl = ev.target.result; startBtn.disabled = false; };
            reader.readAsDataURL(file);
        };

        // 播放音效的函式
        function playSound(audio) {
            audio.currentTime = 0; // 歸零重新播放（防止連續點擊沒聲音）
            audio.volume = volSlider.value;
            audio.play().catch(e => console.log("音效播放失敗", e));
        }

        // 擊中邏輯
        target.onmousedown = (e) => {
            if (!gameActive) return;
            e.stopPropagation();
            playSound(hitSound); // 播放擊中聲
            hits++; clicks++; score += 100;
            updateUI();
            
            // 嘴砲文字
            const quote = HIT_QUOTES[Math.floor(Math.random() * HIT_QUOTES.length)];
            const span = document.createElement('span');
            span.className = 'hit-text'; span.innerText = quote;
            span.style.left = e.clientX + 'px'; span.style.top = e.clientY + 'px';
            document.getElementById('text-effect-container').appendChild(span);
            setTimeout(() => span.remove(), 1000);

            target.classList.add('hit');
            setTimeout(spawnTarget, 150);
        };

        // 沒打中
        gameStage.onmousedown = () => {
            if (!gameActive) return;
            playSound(missSound); // 播放空槍聲
            clicks++;
            updateUI();
        };

        function spawnTarget() {
            target.classList.remove('hit');
            const size = 80;
            target.style.width = target.style.height = size + 'px';
            target.style.left = Math.random() * (window.innerWidth - size) + 'px';
            target.style.top = (Math.random() * (window.innerHeight - size - 150) + 150) + 'px';
            target.style.backgroundImage = `url('${userImageUrl}')`;
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('accuracy').innerText = Math.round((hits/clicks)*100 || 100) + '%';
        }

        function startGame() {
            gameActive = true; menu.style.display = 'none'; gameStage.style.display = 'block';
            spawnTarget();
            const timer = setInterval(() => {
                timeLeft--; updateUI();
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    playSound(winSound); // 播放結束聲
                    alert("林德懷被打爛了！總分：" + score);
                    location.reload();
                }
            }, 1000);
        }

        startBtn.onclick = startGame;
    </script>
</body>
</html>
