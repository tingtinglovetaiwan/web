<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>賀！許文睿榮登海大養殖特招正取1</title>
    <style>
        /* 基礎設定與海洋風深色背景 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #020617 100%);
            color: #f8fafc;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 慶祝卡片主體 */
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 2px solid #eab308; /* 金色邊框 */
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(234, 179, 8, 0.2);
            max-width: 480px;
            width: 90%;
            transform: translateY(0);
            animation: float 4s ease-in-out infinite;
            z-index: 10;
        }

        /* 卡片漂浮微動效（模擬水波感） */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 榮譽稱號樣式 */
        .badge {
            background: linear-gradient(90deg, #ca8a04, #facc15);
            color: #0f172a;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
        }

        /* 許文睿的照片框架 */
        .photo-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            border: 4px solid #facc15;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
            overflow: hidden;
            background-color: #1e293b;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 名字大標題 */
        h1 {
            font-size: 2.8rem;
            margin: 0 0 1rem 0;
            letter-spacing: 4px;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 錄取科系 */
        .department {
            font-size: 1.4rem;
            color: #38bdf8; /* 天藍色 */
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        /* 正取1頭銜 */
        .rank {
            font-size: 2.2rem;
            color: #facc15; /* 金色 */
            font-weight: 800;
            margin-bottom: 2rem;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.6);
        }

        /* 互動按鈕 */
        .btn {
            background: #eab308;
            color: #0f172a;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(234, 179, 8, 0.3);
        }

        .btn:hover {
            background: #facc15;
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(234, 179, 8, 0.5);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 彩帶畫布置頂 */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- 慶祝彩帶畫布 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 網頁主卡片 -->
    <div class="card">
        <div class="badge">🎉 賀！特招榜首 🎉</div>
        
        <!-- 【照片位置】請把 src 改成你同學的照片網址（或放在 GitHub 同資料夾的檔名，例如：wenrui.jpg） -->
        <div class="photo-container">
            <img src="IMG_3280.PNG" alt="許文睿的照片">
        </div>

        <h1>許文睿</h1>
        <div class="department">國立臺灣海洋大學</div>
        <div class="department">水產養殖學系</div>
        <div class="rank">🔥 特招正取 1 🔥</div>
        
        <button class="btn" onclick="celebrate()">點擊發射彩帶慶祝 🔊</button>
    </div>

    <!-- 【MP3 音效位置】把 src 改成你的 MP3 檔案名稱或網址即可 -->
    <audio id="07317b6b33ea6b821f8a1a38ec63e82c.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        const sound = document.getElementById('celebrate-sound');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height + 20;
                this.size = Math.random() * 8 + 6;
                this.speedX = (Math.random() - 0.5) * 16;
                this.speedY = -(Math.random() * 15 + 18);
                this.gravity = 0.45;
                const colors = ['#facc15', '#eab308', '#38bdf8', '#0ea5e9', '#ffffff', '#22c55e'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 12;
            }

            update() {
                this.speedY += this.gravity;
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function celebrate() {
            // 播放 MP3，currentTime = 0 確保連續狂點按鈕時聲音能重複中斷重播
            sound.currentTime = 0;
            sound.play().catch(err => {
                console.log("提示：需要與網頁產生點擊互動後，瀏覽器才允許播放聲音。", err);
            });

            for (let i = 0; i < 120; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].y > canvas.height + 20 || particles[i].x < -20 || particles[i].x > canvas.width + 20) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
