<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俊凱的打手槍訓練網站 - 自由位置版</title>
    <style>
        :root {
            --val-red: #ff4655;
            --val-dark: #0f1923;
            --val-white: #ece8e1;
            --val-cyan: #00feca;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--val-dark);
            color: var(--val-white);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* 遊戲背景層 */
        #game-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none; /* 預設隱藏 */
            cursor: crosshair;
        }

        /* UI 上層資訊 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 100;
            background: rgba(15, 25, 35, 0.8);
            padding: 10px 30px;
            border: 1px solid var(--val-red);
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 12px; color: var(--val-red); text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; }

        /* 返回按鈕 */
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 101;
            background: transparent;
            color: var(--val-white);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 15px;
            cursor: pointer;
        }
        #back-btn:hover { background: var(--val-red); border-color: var(--val-red); }

        /* 靶子（核心改動：使用 div + img 避免 CORS） */
        #target {
            position: absolute;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--val-cyan);
            box-shadow: 0 0 15px var(--val-cyan);
            cursor: crosshair;
            transition: transform 0.1s;
        }
        #target:active { transform: scale(0.9); }

        /* 選單介面 */
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 25, 35, 0.95);
            padding: 40px;
            border-left: 8px solid var(--val-red);
            z-index: 200;
            width: 380px;
        }

        h1 { color: var(--val-red); font-size: 32px; margin-bottom: 5px; }
        .subtitle { color: var(--val-cyan); font-size: 14px; margin-bottom: 25px; }

        .settings { text-align: left; display: flex; flex-direction: column; gap: 15px; }
        input[type="text"], input[type="range"] { width: 100%; box-sizing: border-box; }
        input[type="text"] {
            background: #1f2933; border: 1px solid var(--val-red);
            color: white; padding: 10px; outline: none;
        }

        .start-trigger {
            background-color: var(--val-red);
            color: white; border: none; padding: 15px;
            width: 100%; font-size: 20px; font-weight: bold;
            cursor: pointer; margin-top: 25px;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
        .start-trigger:hover { background: white; color: var(--val-dark); }

    </style>
</head>
<body>

    <div id="game-stage">
        <button id="back-btn">← 返回首頁</button>
        
        <div id="ui-layer">
            <div class="stat-box"><div class="stat-label">倒數</div><div id="timer" class="stat-value">60</div></div>
            <div class="stat-box"><div class="stat-label">分數</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">命中率</div><div id="accuracy" class="stat-value">100%</div></div>
        </div>

        <div id="target"></div>
    </div>

    <div id="menu">
        <h1>俊凱的打手槍訓練網站</h1>
        <div class="subtitle">自定義照片網址 & 全螢幕練習</div>
        
        <div class="settings">
            <div class="setting-item">
                <label>照片網址 (貼上連結):</label>
                <input type="text" id="img-url" placeholder="http://..." value="">
            </div>

            <div class="setting-item">
                <label>靶子大小: <span id="size-val">60</span> px</label>
                <input type="range" id="size-slider" min="30" max="150" step="1" value="60">
            </div>
        </div>
        
        <button class="start-trigger" id="start-btn">開始練槍</button>
    </div>

    <script>
        const menu = document.getElementById('menu');
        const gameStage = document.getElementById('game-stage');
        const target = document.getElementById('target');
        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const imgInput = document.getElementById('img-url');
        const sizeSlider = document.getElementById('size-slider');
        
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const accEl = document.getElementById('accuracy');

        let score = 0, timeLeft = 60, hits = 0, clicks = 0, gameActive = false, timerInterval;

        // 更新大小數值顯示
        sizeSlider.oninput = () => document.getElementById('size-val').innerText = sizeSlider.value;

        // 返回首頁功能
        function returnToHome() {
            gameActive = false;
            clearInterval(timerInterval);
            gameStage.style.display = 'none';
            menu.style.display = 'block';
            menu.querySelector('h1').innerText = "俊凱的打手槍訓練網站";
        }

        // 產生隨機位置 (不只在一條線上)
        function spawnTarget() {
            const size = parseInt(sizeSlider.value);
            target.style.width = size + 'px';
            target.style.height = size + 'px';

            // 隨機計算 X 和 Y，避開邊緣
            const maxX = window.innerWidth - size - 50;
            const maxY = window.innerHeight - size - 100;
            const randomX = Math.max(50, Math.random() * maxX);
            const randomY = Math.max(100, Math.random() * maxY);

            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';

            // 設定照片
            if (imgInput.value.trim() !== "") {
                target.style.backgroundImage = `url('${imgInput.value}')`;
                target.style.backgroundColor = "transparent";
                target.innerText = "";
            } else {
                target.style.backgroundImage = "none";
                target.style.backgroundColor = "#ff4655";
                target.innerText = "🎯";
                target.style.display = "flex";
                target.style.alignItems = "center";
                target.style.justifyContent = "center";
                target.style.fontSize = (size/2) + "px";
            }
        }

        // 擊中判定
        target.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            e.stopPropagation(); // 防止觸發背景的點擊
            hits++;
            clicks++;
            score += 10;
            updateStats();
            spawnTarget();
        });

        // 沒點中背景 (扣命中率)
        gameStage.addEventListener('mousedown', () => {
            if (!gameActive) return;
            clicks++;
            updateStats();
        });

        function updateStats() {
            scoreEl.innerText = score;
            const acc = clicks === 0 ? 100 : Math.round((hits / clicks) * 100);
            accEl.innerText = acc + '%';
        }

        function startGame() {
            score = 0; timeLeft = 60; hits = 0; clicks = 0;
            gameActive = true;
            menu.style.display = 'none';
            gameStage.style.display = 'block';
            
            updateStats();
            spawnTarget();

            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            alert(`時間到！\n俊凱，你的總分是: ${score}\n命中率: ${accEl.innerText}`);
            returnToHome();
        }

        startBtn.onclick = startGame;
        backBtn.onclick = returnToHome;

        // 視窗大小改變時重新定位，防止靶子跑出去
        window.onresize = () => { if(gameActive) spawnTarget(); };
    </script>
</body>
</html>
