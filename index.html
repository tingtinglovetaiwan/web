<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俊凱的打手槍訓練網站 - 網址自定義版</title>
    <style>
        :root {
            --val-red: #ff4655;
            --val-dark: #0f1923;
            --val-white: #ece8e1;
            --val-cyan: #00feca;
        }

        body {
            margin: 0;
            background-color: var(--val-dark);
            color: var(--val-white);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 40px;
            z-index: 10;
            background: rgba(15, 25, 35, 0.8);
            padding: 10px 30px;
            border: 1px solid var(--val-red);
            pointer-events: none;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 12px; color: var(--val-red); text-transform: uppercase; }
        .stat-value { font-size: 24px; font-weight: bold; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        canvas { display: block; }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 25, 35, 0.95);
            padding: 40px 50px;
            border-left: 8px solid var(--val-red);
            z-index: 20;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            width: 350px;
        }

        h1 { color: var(--val-red); font-size: 28px; margin-bottom: 5px; }
        .subtitle { color: var(--val-cyan); font-size: 13px; margin-bottom: 20px; }

        .settings {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }

        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 14px; color: #aaa; }

        input[type="text"] {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--val-red);
            color: white;
            padding: 8px;
            outline: none;
            font-size: 12px;
        }

        input[type="range"] { width: 100%; accent-color: var(--val-red); }

        button {
            background-color: var(--val-red);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 20px;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }

        button:hover { background-color: var(--val-white); color: var(--val-dark); }
        
        #head-line-guide {
            position: absolute;
            top: 50%;
            width: 100%;
            height: 2px;
            background: rgba(255, 70, 85, 0.15);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="stat-box"><div class="stat-label">倒數</div><div id="timer" class="stat-value">60</div></div>
        <div class="stat-box"><div class="stat-label">分數</div><div id="score" class="stat-value">0</div></div>
        <div class="stat-box"><div class="stat-label">命中率</div><div id="accuracy" class="stat-value">100%</div></div>
    </div>

    <div id="menu">
        <h1>俊凱的打手槍訓練網站</h1>
        <div class="subtitle">客製化靶子：水平頭線練習</div>
        
        <div class="settings">
            <div class="setting-item">
                <label>目標照片網址 (貼上 URL):</label>
                <input type="text" id="img-url" placeholder="https://ci3.googleusercontent.com/mail-img-att/AGAZnRrZr2S49npQjtLGVTn7Y7mm76x2D04IC_eHZXE_3TWzxZFFw1EUYqyCOYIykRU-ZwNqLg-qAbfC0fNQeoxs7XNWsH3i-xRcY-8rWoKGXEv5D3GL7niUonoz4Gp-vBfHgOizUMbwm3YOndZE_hzbck1EK7hswWWTyB1tEgwxDrMyQKAlkhFSOCyUQs7nXICdk83q4riGo6vG9uJNQLivsAt1_FL1-fVRO8IAHLuwg5btX_j1KpOz7_NQ5thbB2t9Y1Kpo98H9te0X_DRDIXsknCtDi81kE60IJyUnSH4gLyQNtemWuu38lJv5cpwUgVCd3gx0fzCYZHYlPHOcajKR6zJ03Np5xbjEDSIiNC_jaQM16tTdeMhqazqaTjXJhJMRmPYYcOJhKjE6d1QFEeSN-TWcRH3wBG3N7loKJNYRnzXfLmEcZS6efmaKpW9f2YBTftsYmcL65x2d9XfBUuV9tiAaSSY7V98ntSXNIDYtsu-VckLhpigfYDNH6TTvEa0S9NuXXvf0zg9wRVSpTQKgk0rke6ZkdcXaXLTyknRrUUiFn4_olmUPZvxV7Ng3t08g85i2MVbvS7S5yOlLyVt3bSuPwoCNC9Pddx-J5xNHXchl1KnQ4gOQ_6YbYeZfp3WqqYiz7_jcdurmSCvHAlITPvUefXvLnYxH9aC3gjO-vOhGG6gtrdqUikKtkw5WdW7I58JjavaDaRtGfIk4CWcCTvzGX9lD6GrQxMilXEA24BJBR3s1GRUsF4ZC9M8UF_QaET8rTQuLVVSQK8kp-w09aayuGGIo3_a0NwpM2FP7U2X5mOemw0h-WkPwgI0J1-U6qHurFPtc1pfxvV_E_eMYF5GcFZhtF2hh66MA98IIJfZmArtxRPyeSGYEwuj-eRI5PZlNwtiRh9HVDHPgLAwBPajkYW_EcE7vfuyuZWgU0t5mJzw-9IxEPElq_V3UIZI33YiFMEFjUQqtsH8q-7IJM31TXXfwAydRYnzrWQu844kSTU6tHlJdkSGGYIVu9FjlGGVVbkPLextLxMPl5Mb0v5xopz8xzbG_0WIdBoO5wj0lJk=s0-l75-ft">
            </div>

            <div class="setting-item">
                <label>滑鼠靈敏度: <span id="sens-val">1.0</span></label>
                <input type="range" id="sens-slider" min="0.1" max="5.0" step="0.1" value="1.0">
            </div>
            
            <div class="setting-item">
                <label>靶子大小: <span id="size-val">30</span></label>
                <input type="range" id="size-slider" min="15" max="60" step="1" value="30">
            </div>
        </div>
        
        <button id="start-btn">開始訓練</button>
    </div>

    <div id="game-container">
        <div id="head-line-guide"></div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');
        const accEl = document.getElementById('accuracy');
        const startBtn = document.getElementById('start-btn');
        const menu = document.getElementById('menu');
        const imgInput = document.getElementById('img-url');
        const sensSlider = document.getElementById('sens-slider');
        const sizeSlider = document.getElementById('size-slider');

        let score = 0, timeLeft = 60, hits = 0, clicks = 0, gameActive = false;
        let target = { x: 0, y: 0, radius: 30 };
        let particles = [];

        // 圖片處理邏輯
        let headImage = new Image();
        let useImage = false;

        imgInput.addEventListener('change', () => {
            if (imgInput.value.trim() !== "") {
                headImage.src = imgInput.value;
                headImage.onload = () => { useImage = true; };
                headImage.onerror = () => { 
                    alert("圖片網址無效或不支援載入，請換一個。");
                    useImage = false; 
                };
            } else {
                useImage = false;
            }
        });

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resize);
        resize();

        sensSlider.oninput = () => document.getElementById('sens-val').innerText = sensSlider.value;
        sizeSlider.oninput = () => {
            document.getElementById('size-val').innerText = sizeSlider.value;
            target.radius = parseInt(sizeSlider.value);
        };

        function spawnTarget() {
            target.y = canvas.height / 2;
            const padding = target.radius * 2 + 50;
            target.x = Math.random() * (canvas.width - padding * 2) + padding;
        }

        function createParticle(x, y, color) {
            for(let i=0; i<12; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15,
                    life: 1.0,
                    color
                });
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!gameActive) return;
            clicks++;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const dist = Math.hypot(mouseX - target.x, mouseY - target.y);

            if (dist < target.radius) {
                hits++;
                score += 3; 
                createParticle(target.x, target.y, useImage ? '#00feca' : '#ffffff');
                spawnTarget();
            }
            updateStats();
        });

        function updateStats() {
            scoreEl.innerText = score;
            const acc = clicks === 0 ? 100 : Math.round((hits / clicks) * 100);
            accEl.innerText = acc + '%';
        }

        function startGame() {
            score = 0; timeLeft = 60; hits = 0; clicks = 0;
            gameActive = true;
            menu.style.display = 'none';
            spawnTarget();
            updateStats();

            const timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);

            animate();
        }

        function endGame() {
            gameActive = false;
            menu.style.display = 'block';
            menu.querySelector('h1').innerText = "訓練結束";
            menu.querySelector('.subtitle').innerText = `俊凱，你的總分: ${score} | 命中率: ${accEl.innerText}`;
            menu.querySelector('button').innerText = "再練一次";
        }

        function animate() {
            if (!gameActive) return;
            ctx.fillStyle = '#0f1923';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 輔助線
            ctx.strokeStyle = 'rgba(236, 232, 225, 0.05)';
            ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();

            // 繪製目標
            if (useImage) {
                const imgSize = target.radius * 2;
                ctx.save();
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.clip(); // 讓圖片變圓形的
                ctx.drawImage(headImage, target.x - target.radius, target.y - target.radius, imgSize, imgSize);
                ctx.restore();
                
                // 外圈裝飾
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 254, 202, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff4655'; ctx.fill();
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.radius * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff'; ctx.fill();
            }

            // 粒子特效
            particles.forEach((p, index) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.025;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
                if(p.life <= 0) particles.splice(index, 1);
            });
            ctx.globalAlpha = 1.0;

            requestAnimationFrame(animate);
        }

        startBtn.onclick = startGame;
    </script>
</body>
</html>
</html>
