<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俊凱練槍大師 - 終極不刪減版</title>
    <style>
        :root {
            --val-red: #ff4655;
            --val-dark: #0f1923;
            --val-white: #ece8e1;
            --val-cyan: #00feca;
            --val-gold: #ffb800;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--val-dark);
            color: var(--val-white);
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            user-select: none;
            cursor: default;
        }

        /* 遊戲舞台 */
        #game-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: none;
            background-color: #0f1923;
            background-image: 
                linear-gradient(rgba(15, 25, 35, 0.95), rgba(15, 25, 35, 0.95)),
                url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiNmZjQ2NTUiIGZpbGwtb3BhY2l0eT0iMC4wNSI+PHBhdGggZD0iTTAgMGg0MHY0MEgwVjB6bTIwIDIwaDIwdjIwSDIWMjB6TTAgMjBoMjB2MjBIMFYyMHoyMCAwaDIwdjIwSDIwVjB6Ii8+PC9nPjwvZz48L3N2Zz4=');
            cursor: crosshair;
        }

        /* UI 頂部資訊欄 */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 100;
            background: rgba(15, 25, 35, 0.9);
            padding: 10px 40px;
            border: 1px solid var(--val-red);
            backdrop-filter: blur(5px);
            pointer-events: none;
        }

        .stat-box { text-align: center; }
        .stat-label { font-size: 12px; color: var(--val-red); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: bold; font-family: monospace; }

        /* 返回按鈕 */
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 101;
            background: transparent;
            color: var(--val-white);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #back-btn:hover { background: var(--val-red); border-color: var(--val-red); }

        /* 靶子實體 */
        #target {
            position: absolute;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 3px solid var(--val-cyan);
            box-shadow: 0 0 25px rgba(0, 254, 202, 0.6);
            cursor: crosshair;
            transition: transform 0.1s ease-out, opacity 0.1s ease-out;
            z-index: 10;
            display: none; /* 初始隱藏，由 JS 顯示 */
        }
        #target.hit-effect {
            transform: scale(0);
            opacity: 0;
        }

        /* 爆頭文字特效 */
        .hit-text {
            position: absolute;
            color: var(--val-gold);
            font-weight: 900;
            font-size: 30px;
            text-shadow: 0 0 12px rgba(255, 184, 0, 0.9), 2px 2px 0px #000;
            pointer-events: none;
            z-index: 50;
            white-space: nowrap;
            animation: hitTextPopup 0.8s ease-out forwards;
        }

        @keyframes hitTextPopup {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, -180%) scale(1.2); opacity: 0; }
        }

        /* 首頁選單介面 */
        #menu {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 25, 35, 0.98);
            padding: 50px;
            border-left: 10px solid var(--val-red);
            z-index: 200;
            width: 450px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        h1 { font-size: 36px; margin: 0; color: var(--val-red); letter-spacing: 2px; }
        .subtitle { color: var(--val-cyan); margin-bottom: 30px; font-weight: bold; font-size: 14px; }

        .settings-grid {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-top: 1px solid #333;
            padding-top: 25px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-item label { font-size: 15px; color: #ccc; }

        input[type="range"] { width: 180px; accent-color: var(--val-red); cursor: pointer; }

        /* 自定義上傳按鈕 */
        .file-box {
            background: #1a252e;
            padding: 10px;
            border: 1px dashed #444;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-box:hover { border-color: var(--val-red); background: #252f38; }

        .start-btn {
            background-color: var(--val-red);
            color: white;
            border: none;
            padding: 20px;
            width: 100%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 40px;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            transition: 0.2s;
        }
        .start-btn:hover { background: white; color: var(--val-dark); transform: scale(1.05); }
        .start-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }

        /* Switch 開關 CSS */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--val-red); }
        input:checked + .slider:before { transform: translateX(22px); }

    </style>
</head>
<body>

    <div id="game-stage">
        <button id="back-btn">退出訓練</button>
        
        <div id="ui-layer">
            <div class="stat-box"><div class="stat-label">TIME</div><div id="timer" class="stat-value">60</div></div>
            <div class="stat-box"><div class="stat-label">SCORE</div><div id="score" class="stat-value">0</div></div>
            <div class="stat-box"><div class="stat-label">ACCURACY</div><div id="accuracy" class="stat-value">100%</div></div>
        </div>

        <div id="target"></div>
        <div id="text-effect-container"></div>
    </div>

    <div id="menu">
        <h1>俊凱練槍大師</h1>
        <div class="subtitle">專為林德懷設計的射擊訓練系統</div>
        
        <div class="settings-grid">
            <div class="file-box" onclick="document.getElementById('image-input').click()">
                <span id="file-status">點擊上傳靶子照片 (PNG/JPG)</span>
                <input type="file" id="image-input" accept="image/*" style="display:none">
            </div>

            <div class="setting-item">
                <label>開啟隨機 AD 走位</label>
                <label class="switch">
                    <input type="checkbox" id="move-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <label>靶子大小 (<span id="size-num">80</span>px)</label>
                <input type="range" id="size-slider" min="40" max="180" value="80">
            </div>

            <div class="setting-item">
                <label>音量大小</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.6">
            </div>
        </div>

        <button class="start-btn" id="start-btn" disabled>請先選擇照片</button>
    </div>

    <script>
        // --- 資源與變數定義 ---
        const HIT_QUOTES = ["阿公67!!", "林德懷沒老二!!", "林德懷是紅髮艾德!!"];
        
        // 音效 (使用更穩定的公開音效庫)
        const sfxHit = new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3');
        const sfxMiss = new Audio('https://www.soundjay.com/buttons/sounds/button-10.mp3');
        const sfxWin = new Audio('https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3');

        // DOM 元素
        const menu = document.getElementById('menu');
        const gameStage = document.getElementById('game-stage');
        const target = document.getElementById('target');
        const startBtn = document.getElementById('start-btn');
        const imageInput = document.getElementById('image-input');
        const sizeSlider = document.getElementById('size-slider');
        const volSlider = document.getElementById('volume-slider');
        const moveToggle = document.getElementById('move-toggle');
        
        let userImage = null;
        let score = 0, hits = 0, clicks = 0, timeLeft = 60;
        let gameActive = false;
        let timerInterval, moveInterval;
        
        // 靶子位置與移動狀態
        let targetX = 0, targetY = 0, moveDir = 1, moveSpeed = 4;
        let isTargetVisible = false;

        // --- 核心邏輯 ---

        // 1. 圖片處理
        imageInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                userImage = event.target.result;
                document.getElementById('file-status').innerText = "已載入照片: " + file.name;
                document.getElementById('file-status').style.color = "#00feca";
                startBtn.disabled = false;
                startBtn.innerText = "進入訓練";
            };
            reader.readAsDataURL(file);
        };

        // 2. 顯示數值即時更新
        sizeSlider.oninput = () => document.getElementById('size-num').innerText = sizeSlider.value;

        // 3. 播放音效
        function play(audio) {
            audio.currentTime = 0;
            audio.volume = volSlider.value;
            audio.play().catch(() => {}); // 避免瀏覽器政策報錯
        }

        // 4. 產生靶子
        function spawnTarget() {
            if (!gameActive) return;

            isTargetVisible = false;
            target.style.display = 'none';
            target.classList.remove('hit-effect');

            const size = parseInt(sizeSlider.value);
            target.style.width = size + 'px';
            target.style.height = size + 'px';
            target.style.backgroundImage = `url(${userImage})`;

            // 計算合法範圍
            const maxX = window.innerWidth - size - 40;
            const maxY = window.innerHeight - size - 160;
            targetX = Math.random() * maxX + 20;
            targetY = Math.random() * maxY + 140;

            target.style.left = targetX + 'px';
            target.style.top = targetY + 'px';
            
            // 隨機移動參數
            moveDir = Math.random() > 0.5 ? 1 : -1;
            moveSpeed = 3 + Math.random() * 5;

            // 顯示
            setTimeout(() => {
                if (gameActive) {
                    target.style.display = 'block';
                    isTargetVisible = true;
                }
            }, 50);
        }

        // 5. 移動邏輯 (AD 走位)
        function handleMovement() {
            if (!gameActive || !isTargetVisible || !moveToggle.checked) return;

            const size = parseInt(sizeSlider.value);
            
            // 隨機變向機率 (每幀 1.5%)
            if (Math.random() < 0.015) {
                moveDir *= -1;
                moveSpeed = 3 + Math.random() * 5;
            }

            targetX += moveDir * moveSpeed;

            // 邊界判定
            if (targetX <= 0) { targetX = 0; moveDir = 1; }
            if (targetX >= window.innerWidth - size) { targetX = window.innerWidth - size; moveDir = -1; }

            target.style.left = targetX + 'px';
        }

        // 6. 點擊判定
        target.onmousedown = (e) => {
            if (!gameActive || !isTargetVisible) return;
            e.stopPropagation();

            play(sfxHit);
            isTargetVisible = false;
            hits++;
            clicks++;
            score += 100;
            updateStats();

            // 消失動畫
            target.classList.add('hit-effect');

            // 彈出文字
            const quote = HIT_QUOTES[Math.floor(Math.random() * HIT_QUOTES.length)];
            const effect = document.createElement('div');
            effect.className = 'hit-text';
            effect.innerText = quote;
            effect.style.left = (targetX + parseInt(sizeSlider.value)/2) + 'px';
            effect.style.top = (targetY + parseInt(sizeSlider.value)/2) + 'px';
            document.getElementById('text-effect-container').appendChild(effect);
            setTimeout(() => effect.remove(), 800);

            // 準備下一個
            setTimeout(spawnTarget, 150);
        };

        gameStage.onmousedown = () => {
            if (!gameActive) return;
            play(sfxMiss);
            clicks++;
            updateStats();
        };

        function updateStats() {
            document.getElementById('score').innerText = score;
            document.getElementById('timer').innerText = timeLeft;
            const acc = clicks === 0 ? 100 : Math.round((hits / clicks) * 100);
            document.getElementById('accuracy').innerText = acc + "%";
        }

        // 7. 開始與結束
        function startGame() {
            score = 0; hits = 0; clicks = 0; timeLeft = 60;
            gameActive = true;
            menu.style.display = 'none';
            gameStage.style.display = 'block';

            updateStats();
            spawnTarget();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateStats();
                if (timeLeft <= 0) endGame();
            }, 1000);

            moveInterval = setInterval(handleMovement, 16);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearInterval(moveInterval);
            play(sfxWin);
            
            setTimeout(() => {
                alert(`訓練結束！\n總分: ${score}\n命中率: ${document.getElementById('accuracy').innerText}\n林德懷表示很不滿。`);
                location.reload();
            }, 500);
        }

        startBtn.onclick = startGame;
        document.getElementById('back-btn').onclick = () => location.reload();

    </script>
</body>
</html>
