<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天天玩樂園 - NPx家族強力招生中！</title>
    <!-- 引入 Google 字體與 Tailwind CSS 讓網頁變好看 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); /* 活潑的漸層背景 */
        }
        .game-card {
            border-radius: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: transform 0.2s ease;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- 1. 頂部主視覺區 (Hero) -->
    <header class="container mx-auto px-6 py-12 text-center max-w-4xl">
        <!-- 家族標誌/首頁大圖 -->
        <div class="w-40 h-40 mx-auto mb-6 rounded-full overflow-hidden border-4 border-white shadow-lg bg-white flex items-center justify-center">
            <!-- 替換：你的家族 Logo 網址 -->
            <img src="https://p2.bahamut.com.tw/B/2KU/53/8fc72aff6b63ea312e9fdcc27f1c2zd5.JPG" alt="家族Logo" class="w-full h-full object-cover">
        </div>
        
        <h1 class="text-4xl md:text-5xl font-extrabold text-amber-600 mb-4 tracking-wide">
            🌟 NPx 招生中！ 🌟
        </h1>
        <p class="text-lg md:text-xl text-amber-800 font-medium mb-8">
            「在天天玩樂園，跟著Hzr7一起詐騙!」
        </p>

        <!-- 行動呼籲按鈕 (點擊會播音效並跳轉表單) -->
        <!-- 替換：把 href="#" 改成你的 Google 表單連結 -->
        <a href="https://forms.gle/HD8jtSY5msyDY65Z7" target="_blank" onclick="playClickSound()" 
           class="inline-block bg-amber-500 hover:bg-amber-600 text-white font-black text-xl px-12 py-5 rounded-full shadow-lg transform hover:scale-105 transition active:scale-95">
            填寫表單・申請加入 🚀
        </a>
    </header>

    <!-- 2. 核心內容區 -->
    <main class="container mx-auto px-6 max-w-4xl flex-grow mb-12">
        <div class="grid md:grid-cols-2 gap-8">
            
            <!-- 家族福利卡片 -->
            <div class="bg-white p-8 game-card">
                <h2 class="text-2xl font-bold text-amber-600 mb-4 flex items-center">
                    🎁 專屬福利
                </h2>
                <ul class="space-y-3 text-gray-600 font-medium">
                    <li class="flex items-center">✅ 團長會帶你詐騙</li>
                    <li class="flex items-center">✅ 團長會開車帶你出去玩</li>
                    <li class="flex items-center">✅ 專屬 Discord 歡樂語音群</li>
                    <li class="flex items-center">✅ 成員熱情好相處，上線絕不孤單</li>
                </ul>
            </div>

            <!-- 入團條件卡片 -->
            <div class="bg-white p-8 game-card">
                <h2 class="text-2xl font-bold text-amber-600 mb-4 flex items-center">
                    📢 招募條件
                </h2>
                <ul class="space-y-3 text-gray-600 font-medium">
                    <li class="flex items-center">📌 要會阿公67</li>
                    <li class="flex items-center">📌 積極參與家族活動，拒絕幽靈人口</li>
                    <li class="flex items-center">📌 配合家族改名（前綴：NPx｜）</li>
                    <li class="flex items-center">📌 嚴禁嘴砲、開掛、互相尊重友善</li>
                </ul>
            </div>

        </div>

        <!-- 3. 歡樂日常照片牆 -->
        <section class="mt-12 bg-white/60 p-8 rounded-3xl shadow-sm">
            <h2 class="text-2xl font-bold text-center text-amber-700 mb-6">📸 家族日常點滴</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <!-- 替換：以下 src 的網址都可以改成你們遊戲內截圖的網址 -->
                <img src="https://upload.cc/i1/2026/06/07/R3xyTL.jpg" alt="遊戲截圖1" class="rounded-xl shadow-sm hover:opacity-90 transition">
                <img src="https://upload.cc/i1/2026/06/07/UhKjlW.jpg" alt="遊戲截圖2" class="rounded-xl shadow-sm hover:opacity-90 transition">
                <img src="https://upload.cc/i1/2026/06/07/fxzKvJ.png" alt="遊戲截圖3" class="rounded-xl shadow-sm hover:opacity-90 transition">
            </div>
        </section>
    </main>

    <!-- 4. 頁尾版權 -->
    <footer class="bg-amber-800/10 text-center py-6 text-sm text-amber-900/60 font-medium">
        © 2026 天天玩樂園 NPx. All Rights Reserved.
    </footer>

    <!-- 音效控制 JavaScript -->
    <script>
        function playClickSound() {
            // 替換：請將下方的網址換成你的 MP3 音效直連網址
            const soundUrl = "https://files.catbox.moe/qmqjkt.mp3"; 
            
            const audio = new Audio(soundUrl);
            audio.play().catch(function(error) {
                // 防止部分瀏覽器因為安全性阻擋自動播放音效
                console.log("音效播放失敗，但網頁會照常跳轉：", error);
            });
        }
    </script>
</body>
</html>
